clients:
  account-service:
    base-url: http://account-service:8081/api/v1
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://transfer-db:5432/transfer_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: kafka:9092
